query GetTeamAssignmentKpis($rcmTeamId: Int) {
  teamAssignmentKpis(rcmTeamId: $rcmTeamId) {
    claims {
      total
      assigned
      notAssigned
      assignmentPercentage
      notAssignedPercentage
      workItemType
    }
    authorizations {
      total
      assigned
      notAssigned
      assignmentPercentage
      notAssignedPercentage
      workItemType
    }
    claimsResubmission {
      total
      assigned
      notAssigned
      assignmentPercentage
      notAssignedPercentage
      workItemType
    }
    totals {
      grandTotal
      totalAssigned
      totalNotAssigned
      overallAssignmentPercentage
      overallNotAssignedPercentage
    }
  }
}



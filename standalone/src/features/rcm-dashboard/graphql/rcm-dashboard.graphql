query GetTeamUserPerformanceKpis($teamIds: [Long]) {
  teamUserPerformanceKpis(teamIds: $teamIds) {
    team {
      id
      name
    }
    users {
      userId
      userName
      claims {
        total
        assigned
        assignmentPercentage
        workItemType
      }
      authorizations {
        total
        assigned
        assignmentPercentage
        workItemType
      }
      claimsResubmission {
        total
        assigned
        assignmentPercentage
        workItemType
      }
      claimsFinancial {
        totalAmount
        assignedAmount
      }
      authorizationsFinancial {
        totalAmount
        assignedAmount
      }
      claimsResubmissionFinancial {
        totalAmount
        assignedAmount
      }
      totals {
        grandTotal
        totalAssigned
        overallAssignmentPercentage
      }
      financialTotals {
        grandTotalAmount
        totalAssignedAmount
      }
    }
  }
}


query GetRcmOptimaTeams($filter: OptimaTeamFilterInput) {
  optimaTeams(filter: $filter) {
    id
    name
    nameAr
    active
  }
}


query GetTeamCoderAvailability($teamId: String!) {
  teamCoderAvailability(teamId: $teamId) {
    id
    coderId
    coderName
    dailyCapacity
    currentWorkload
    remainingCapacity
    isAvailable
    isAtCapacity
    specialty
    unavailableReason
  }
}


query GetUnassignedValidationRequests($first: Int, $last: Int, $after: String, $before: String, $filter: OptimaValidationRequestFilterInput, $sortBy: OptimaValidationRequestsSortingInput) {
  rcmOptimaValidationRequests(first: $first, last: $last, after: $after, before: $before, filter: $filter, sortBy: $sortBy) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      endCursor
      startCursor
    }
    edges {
      node {
        id
        requestId
        billNumber
        patientName
        nationalId
        insurancePayer
        approvalStatus
        claimStatus
        createdDate
        billDate
        priority
        gross
        net
        requestType
        departmentName
        assignment {
          id
          completionStatus
          assigneeName
          assigneeUser {
            id
            fullName
          }
        }
      }
    }
  }
}



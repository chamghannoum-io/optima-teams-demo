query GetMemberWorkProgressCounts($assignedTo: [String]!) {
  preClaimsDone: rcmOptimaValidationRequests(
    first: 1
    filter: { assignmentAssignedTo: $assignedTo, assignmentCompletionStatuses: [DONE] }
  ) {
    totalCount
  }
  preClaimsInProgress: rcmOptimaValidationRequests(
    first: 1
    filter: { assignmentAssignedTo: $assignedTo, assignmentCompletionStatuses: [IN_PROGRESS] }
  ) {
    totalCount
  }
  preClaimsOpen: rcmOptimaValidationRequests(
    first: 1
    filter: { assignmentAssignedTo: $assignedTo, assignmentCompletionStatuses: [OPEN] }
  ) {
    totalCount
  }
  claimsDone: claimSubmissions(
    first: 1
    filter: { assignmentAssignedTo: $assignedTo, assignmentCompletionStatuses: [DONE] }
  ) {
    totalCount
  }
  claimsInProgress: claimSubmissions(
    first: 1
    filter: { assignmentAssignedTo: $assignedTo, assignmentCompletionStatuses: [IN_PROGRESS] }
  ) {
    totalCount
  }
  claimsOpen: claimSubmissions(
    first: 1
    filter: { assignmentAssignedTo: $assignedTo, assignmentCompletionStatuses: [OPEN] }
  ) {
    totalCount
  }
  authsDone: authorizationSubmissions(
    first: 1
    filter: { assignmentAssignedTo: $assignedTo, assignmentCompletionStatuses: [DONE] }
  ) {
    totalCount
  }
  authsInProgress: authorizationSubmissions(
    first: 1
    filter: { assignmentAssignedTo: $assignedTo, assignmentCompletionStatuses: [IN_PROGRESS] }
  ) {
    totalCount
  }
  authsOpen: authorizationSubmissions(
    first: 1
    filter: { assignmentAssignedTo: $assignedTo, assignmentCompletionStatuses: [OPEN] }
  ) {
    totalCount
  }
}


query GetMemberAssignedClaimSubmissions($first: Int, $filter: ClaimSubmissionFilterInput, $sortBy: ClaimSubmissionsSortingInput) {
  claimSubmissions(first: $first, filter: $filter, sortBy: $sortBy) {
    totalCount
    edges {
      node {
        id
        transactionId
        claimId
        patientName
        insurancePayer
        approvalStatus
        status
        createdAt
        submittedAt
        totalNet
        totalApprovedNet
        encounterType
        type
        priority
        assignment {
          id
          completionStatus
          assigneeName
          assignedAt
          assigneeUser {
            id
            fullName
          }
        }
      }
    }
  }
}


query GetOverduePendingAuthStats($fromDueAt: Instant) {
  recentOverdue: authorizationSubmissions(
    first: 1
    filter: { statuses: [PAYER_OVERDUE, PROVIDER_OVERDUE], fromDueAt: $fromDueAt }
  ) {
    totalCount
  }
  allPending: authorizationSubmissions(
    first: 500
    filter: { statuses: [PENDING] }
  ) {
    totalCount
    edges {
      node {
        id
        createdAt
      }
    }
  }
}

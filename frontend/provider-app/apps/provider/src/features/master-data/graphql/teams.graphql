query GetOptimaTeams($filter: OptimaTeamFilterInput) {
  optimaTeams(filter: $filter) {
    id
    name
    nameAr
    description
    active
    tag
    tags {
      id
      tag
      isGroup
      tagOperation
      tags {
        id
        tag
        isGroup
        tagOperation
        tags {
          id
          tag
          isGroup
          tagOperation
          tags {
            id
            tag
            isGroup
            tagOperation
            tags {
              id
              tag
              isGroup
              tagOperation
              tags {
                id
                tag
                isGroup
                tagOperation
              }
            }
          }
        }
      }
    }
    createdDate
    rotationEnabled
    rotationFrequency
    nextRotationDate
    branchIds
    branches {
      id
      name
      nameAr
    }
    usersDetails {
      id
      firstName
      firstNameAr
      lastName
      lastNameAr
      email
      appRole
      isActive
    }
  }
}


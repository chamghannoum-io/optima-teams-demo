# Publishes the Teams v2 demo to GitHub Pages.
#
# Always builds with PUBLIC=1, which swaps the real staff identities for stable
# pseudonyms. Never publish a plain `vite build` — that bundle contains real names
# and employer-domain email addresses.
name: Deploy demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: standalone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - name: Build public bundle (pseudonymized)
        run: npm run build:public
        env:
          PAGES_REPO: ${{ github.event.repository.name }}
      - name: Fail if the bundle contains real identities
        run: |
          if grep -rIl -e saudigerman -e '@sgh' dist/ ; then
            echo "::error::Real identities found in the build — refusing to publish."
            exit 1
          fi
          echo "bundle clean"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: standalone/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
